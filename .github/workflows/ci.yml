name: CI

# Gates every PR into staging and main (DashOne §1). Nothing here needs secrets: the
# database tests run against PGlite in-process, so CI proves the tenancy contract without
# a Supabase project or a Docker service.
on:
  # Every PR, not just those into staging/main. DashOne §1 requires the gate on PRs into
  # those two branches; running it everywhere is a superset, and it closes a real hole —
  # a stacked PR based on another feature branch would otherwise merge with no CI at all.
  pull_request:
  push:
    branches: [staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # No `submodules: true`: `.dashone` is a private repo holding the engineering
      # standard, which is guidance for humans and agents reading the code — nothing in
      # the build or the tests reads it. Fetching it would make CI depend on a token with
      # access to another private repo, for no benefit.
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # 24, not 22: the migration CLI is a .ts entrypoint run directly by node, and
          # type stripping is only unflagged from 23.6 onward. On 22 it would need
          # --experimental-strip-types and emit a warning on every run.
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Static tenancy gate: catches a table added with no RLS policy in seconds, before
      # anyone waits on the suite. The live-catalog version runs in packages/db tests.
      - name: RLS policy check
        run: pnpm check:rls

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Advisories are a gate, not a newsletter (DashOne §1). `--prod` scopes this to what
      # actually ships; dev-only advisories are surfaced by the audit-dev step as a warning.
      - name: Audit dependencies
        run: pnpm audit --prod --audit-level moderate

      - name: Audit dev dependencies (advisory)
        run: pnpm audit --audit-level high
        continue-on-error: true

      # Placeholder keys: Clerk validates the *format* of a publishable key at build time,
      # so the build needs a syntactically valid one. It never contacts Clerk — no real
      # credential is required to prove the app compiles.
      - name: Build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dmVyaWZpZWQtdG9tY2F0LTk5LmNsZXJrLmFjY291bnRzLmRldiQ=
          CLERK_SECRET_KEY: sk_test_ci_placeholder
        run: pnpm build

  extractor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/extractor

    steps:
      - uses: actions/checkout@v7

      # Pinned to an exact version, unlike the others: setup-uv publishes no floating
      # major tag, so `@v10` does not resolve.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra dev

      - name: Test
        run: uv run pytest -q

      # Audits the resolved dependency set rather than the installed environment:
      # `pip-audit` cannot look up the local editable project on PyPI, and --strict would
      # (correctly) refuse to silently skip it.
      #
      # `--all-extras` on purpose, even though this job installs only `dev`. The `ml` extra
      # is not optional in production — torch, easyocr and faster-whisper are what actually
      # runs on Fly.io — so auditing the installed set would gate the dependencies that
      # never leave CI while ignoring the ones that do. Exporting resolves metadata without
      # downloading the wheels at all, so the extra coverage costs nothing.
      #
      # The `sed` strips torch's `+cpu` local version identifier, and it is load-bearing on
      # Linux — which is to say, here and nowhere else. `pyproject.toml` pins torch to the
      # PyTorch CPU index on Linux, so the export reads `torch==2.13.0+cpu`, and PyPI has no
      # such release to look up: pip-audit fails to resolve it and `--strict` (correctly)
      # fails the build rather than skipping it silently. `2.13.0+cpu` and `2.13.0` are the
      # same upstream release built without the CUDA payload, and advisories are filed
      # against the release, so auditing the plain version audits exactly this code under
      # the name the advisory database knows it by.
      #
      # `--no-hashes` follows from the same edit: a hash pins the CPU wheel, which is not the
      # artifact the stripped version names. Integrity is `uv.lock`'s job — this step's job
      # is CVEs.
      - name: Audit dependencies
        run: |
          uv export --all-extras --no-emit-project --no-hashes --format requirements-txt \
            | sed -E 's/^(torch|torchvision)==([0-9][0-9a-z.]*)\+cpu/\1==\2/' \
            | uv run --with pip-audit pip-audit --strict -r /dev/stdin

  # UC-6 rule 7: every image MUST build in CI. A Dockerfile first built during an incident
  # is not a deploy artifact — it is a second problem discovered at the worst moment.
  #
  # Build only, never push. CI has no registry credentials and needs none: the question
  # being answered is "does this still build", and Fly builds its own image on `fly deploy`
  # from the same file. Pushing would add a secret to the gate for no extra guarantee.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      # Both images always report, rather than the extractor's long torch download hiding
      # a one-line syntax error in the worker's.
      fail-fast: false
      matrix:
        include:
          # Root context: a pnpm workspace cannot be built from a leaf, because the
          # lockfile and the sibling packages live above it.
          - name: worker
            context: .
            dockerfile: apps/worker/Dockerfile
          # Self-contained uv project — CLAUDE.md keeps Python to this directory.
          - name: extractor
            context: apps/extractor
            dockerfile: apps/extractor/Dockerfile

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          # GitHub's own layer cache. Without it every PR re-downloads torch, and a
          # 20-minute image job is one people learn to ignore.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  secret-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      # UC-0 acceptance criterion: no key-shaped string outside .env.example placeholders.
      - name: Check for committed secrets
        run: |
          if git grep -nIE '(sk_live_|sk_test_|apify_api_[A-Za-z0-9]|eyJ[A-Za-z0-9_-]{20,}\.)' \
               -- ':!.env.example' ':!.github/workflows/ci.yml'; then
            echo "::error::Key-shaped string committed outside .env.example. Secrets live in Doppler."
            exit 1
          fi
          echo "No key-shaped strings found outside .env.example."
